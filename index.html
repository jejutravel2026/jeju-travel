/* 🌺 BGM – iOS Safari 호환을 위해 별도 스크립트로 분리 */
var BGM = (function() {
  try {
    var ctx=null, running=false, nodes=[], melTid=null;
    var BPM=100, Q=60/BPM;
    var D4=294,E4=330,G4=392,A4=440,B4=494,D5=587,E5=659;
    var G2=98,D3=147,C3=131,E3=165;
    var MEL=[
      [G4,.5],[B4,.5],[D5,.5],[E5,.5],
      [D5,.5],[B4,.5],[A4,.5],[G4,.5],
      [A4,.5],[B4,.5],[D5,.5],[E5,.5],
      [D5,1.0],[G4,.5],[0,.5],
      [E5,.5],[D5,.5],[B4,.5],[G4,.5],
      [A4,.5],[G4,.5],[E4,.5],[D4,.5],
      [G4,.5],[A4,.5],[B4,.5],[D5,.5],
      [G4,1.5],[0,.5]
    ];
    var BASS=[
      [G2,2],[D3,2],[G2,2],[D3,2],
      [C3,2],[D3,2],[G2,2],[D3,2]
    ];
    function getCtx(){
      if(!ctx) ctx=new(window.AudioContext||window.webkitAudioContext)();
      if(ctx.state==='suspended') ctx.resume();
      return ctx;
    }
    function makeNoise(ac){
      var len=ac.sampleRate*4;
      var buf=ac.createBuffer(1,len,ac.sampleRate);
      var d=buf.getChannelData(0);
      for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
      var src=ac.createBufferSource();
      src.buffer=buf; src.loop=true;
      return src;
    }
    function startWaves(){
      var ac=getCtx();
      var s1=makeNoise(ac), lpf=ac.createBiquadFilter(), lfo1=ac.createOscillator(), lfog1=ac.createGain(), g1=ac.createGain(), vlfo1=ac.createOscillator(), vg1=ac.createGain();
      lpf.type='lowpass'; lpf.frequency.value=320; lpf.Q.value=0.7;
      lfo1.type='sine'; lfo1.frequency.value=0.115; lfog1.gain.value=180;
      lfo1.connect(lfog1); lfog1.connect(lpf.frequency);
      g1.gain.value=0.18; vlfo1.type='sine'; vlfo1.frequency.value=0.115; vg1.gain.value=0.08;
      vlfo1.connect(vg1); vg1.connect(g1.gain);
      s1.connect(lpf); lpf.connect(g1); g1.connect(ac.destination);
      s1.start(); lfo1.start(); vlfo1.start(); nodes.push(s1,lfo1,vlfo1);

      var s2=makeNoise(ac), bpf=ac.createBiquadFilter(), lfo2=ac.createOscillator(), lfog2=ac.createGain(), g2=ac.createGain(), vlfo2=ac.createOscillator(), vg2=ac.createGain();
      bpf.type='bandpass'; bpf.frequency.value=900; bpf.Q.value=0.5;
      lfo2.type='sine'; lfo2.frequency.value=0.18; lfog2.gain.value=550;
      lfo2.connect(lfog2); lfog2.connect(bpf.frequency);
      g2.gain.value=0.045; vlfo2.type='sine'; vlfo2.frequency.value=0.18; vg2.gain.value=0.02;
      vlfo2.connect(vg2); vg2.connect(g2.gain);
      s2.connect(bpf); bpf.connect(g2); g2.connect(ac.destination);
      s2.start(); lfo2.start(); vlfo2.start(); nodes.push(s2,lfo2,vlfo2);

      var s3=makeNoise(ac), hpf=ac.createBiquadFilter(), g3=ac.createGain(), vlfo3=ac.createOscillator(), vg3=ac.createGain();
      hpf.type='highpass'; hpf.frequency.value=3500;
      g3.gain.value=0.015; vlfo3.type='sine'; vlfo3.frequency.value=0.22; vg3.gain.value=0.007;
      vlfo3.connect(vg3); vg3.connect(g3.gain);
      s3.connect(hpf); hpf.connect(g3); g3.connect(ac.destination);
      s3.start(); vlfo3.start(); nodes.push(s3,vlfo3);
    }
    function pluck(freq,t,vol){
      vol=vol||0.13;
      if(!freq||!ctx) return;
      var o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.value=freq;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.002); g.gain.exponentialRampToValueAtTime(.001,t+.42);
      o.start(t); o.stop(t+.45);
      var o2=ctx.createOscillator(), g2=ctx.createGain();
      o2.type='triangle'; o2.frequency.value=freq*2;
      o2.connect(g2); g2.connect(ctx.destination);
      g2.gain.setValueAtTime(0,t); g2.gain.linearRampToValueAtTime(vol*.28,t+.002); g2.gain.exponentialRampToValueAtTime(.001,t+.18);
      o2.start(t); o2.stop(t+.2);
    }
    function scheduleMel(t0){
      var t=t0, i;
      for(i=0;i<MEL.length;i++){ pluck(MEL[i][0],t); t+=MEL[i][1]*Q; }
      t=t0;
      for(i=0;i<BASS.length;i++){
        if(BASS[i][0]){
          var o=ctx.createOscillator(), g=ctx.createGain();
          o.type='triangle'; o.frequency.value=BASS[i][0];
          o.connect(g); g.connect(ctx.destination);
          g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.05,t+.003); g.gain.exponentialRampToValueAtTime(.001,t+BASS[i][1]*Q*.8);
          o.start(t); o.stop(t+BASS[i][1]*Q);
        }
        t+=BASS[i][1]*Q;
      }
      var total=0; for(i=0;i<MEL.length;i++) total+=MEL[i][1]*Q;
      return t0+total;
    }
    function loopMel(t0){
      if(!running) return;
      var end=scheduleMel(t0);
      melTid=setTimeout(function(){loopMel(end);}, Math.max(0,(end-ctx.currentTime-.2)*1000));
    }
    function start(){
      if(running) return;
      running=true; startWaves(); loopMel(getCtx().currentTime+.3);
    }
    function stop(){
      running=false; clearTimeout(melTid);
      nodes.forEach(function(n){try{n.stop();}catch(e){}}); nodes=[];
    }
    return { start:start, stop:stop, toggle:function(){running?stop():start();}, on:function(){return running;} };
  } catch(e) {
    console.warn('BGM init error:', e);
    return { start:function(){}, stop:function(){}, toggle:function(){}, on:function(){return false;} };
  }
})();

const SFX = (() => {
  let _ctx = null;
  const get = () => {
    if (!_ctx) _ctx = new (window.AudioContext||window.webkitAudioContext)();
    if (_ctx.state === 'suspended') _ctx.resume();
    return _ctx;
  };
  const tick = () => {
    try {
      const ac = get(), o = ac.createOscillator(), g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.frequency.setValueAtTime(1800, ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(600, ac.currentTime+.04);
      g.gain.setValueAtTime(.08, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime+.07);
      o.start(); o.stop(ac.currentTime+.08);
    } catch {}
  };
  const stamp = () => {
    try {
      const ac = get();
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.setValueAtTime(90, ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(35, ac.currentTime+.12);
      g.gain.setValueAtTime(.5, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime+.18);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime+.2);
      const n = ac.sampleRate*.06, buf = ac.createBuffer(1,n,ac.sampleRate), d = buf.getChannelData(0);
      for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2)*.8;
      const src = ac.createBufferSource(); src.buffer = buf;
      const f = ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1200; f.Q.value=.7;
      const g2 = ac.createGain(); g2.gain.value=.9;
      src.connect(f); f.connect(g2); g2.connect(ac.destination); src.start();
    } catch {}
  };
  const coin = () => {
    try {
      const ac = get();
      [1047,1319,1568,2093].forEach((fr,i)=>{
        const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime+i*.055;
        o.type='triangle'; o.frequency.value=fr;
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.18,t+.01);
        g.gain.exponentialRampToValueAtTime(.001,t+.35);
        o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+.4);
      });
    } catch {}
  };
  const flip = () => {
    try {
      const ac = get(), n=ac.sampleRate*.14, buf=ac.createBuffer(1,n,ac.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n)*.45;
      const src=ac.createBufferSource(); src.buffer=buf;
      const f=ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=2500;
      const g=ac.createGain(); g.gain.value=.7;
      src.connect(f); f.connect(g); g.connect(ac.destination); src.start();
    } catch {}
  };
  const err = () => {
    try {
      const ac=get();
      [200,170,140].forEach((fr,i)=>{
        const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime+i*.08;
        o.type='square'; o.frequency.value=fr;
        g.gain.setValueAtTime(.08,t); g.gain.exponentialRampToValueAtTime(.001,t+.1);
        o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+.12);
      });
    } catch {}
  };
  const pop = () => {
    try {
      const ac=get(), o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.setValueAtTime(300,ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(600,ac.currentTime+.05);
      g.gain.setValueAtTime(.2,ac.currentTime); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.12);
      o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+.15);
    } catch {}
  };
  return {tick,stamp,coin,flip,err,pop};
})();

/* ═══════════════════════════════════════════════
   APP COMPONENT
═══════════════════════════════════════════════ */
function App(){
  const [places, setPlaces] = useState(()=>{
    try{
      const s=localStorage.getItem('jlg_places_v2');
      if(s){ const d=JSON.parse(s); if(d.length>0) return d; }
    }catch{}
    return SEED_PLACES;
  });
  const [favs,  setFavs]  = useState(()=>{
    try{return new Set(JSON.parse(localStorage.getItem('jlg_favs_v2')||'[]'));}
    catch{return new Set();}
  });
  const [tab,    setTab]    = useState('all');
  const [view,   setView]   = useState('main');
  const [isAdm,  setIsAdm]  = useState(false);
  const [modal,  setModal]  = useState(null);
  const [delId,  setDelId]  = useState(null);
  const [pw,     setPw]     = useState('');
  const [form,   setForm]   = useState({name:'',category:'식당',desc:'',link:'',bookingLink:'',isFeatured:false,isSponsored:false});
  const [editId, setEditId] = useState(null);
  const [toast,  setToast]  = useState('');
  const [stamps, setStamps] = useState({});
  const [scroll, setScroll] = useState(0);
  const [bgmOn,  setBgmOn]  = useState(true);
  const [posts,     setPosts]    = useState([]);
  const [postsLoading, setPostsLoading] = useState(false);
  const [boardForm, setBoardForm] = useState({nickname:'',content:''});
  const [posting,   setPosting]  = useState(false);
  const toastRef = useRef();

  /* ── BGM 첫 터치 시 자동시작 ── */
  useEffect(()=>{
    const start=()=>{ BGM.start(); setBgmOn(true); };
    window.addEventListener('touchstart',start,{once:true});
    window.addEventListener('click',start,{once:true});
    return()=>{ window.removeEventListener('touchstart',start); window.removeEventListener('click',start); };
  },[]);

  function toggleBGM(){
    if(BGM.on()){ BGM.stop(); setBgmOn(false); }
    else { BGM.start(); setBgmOn(true); }
  }

  /* ── 게시판 ── */
  async function fetchPosts(){
    setPostsLoading(true);
    try{
      const r=await fetch('/api/posts');
      if(r.ok){ const d=await r.json(); setPosts(Array.isArray(d)?d:[]); }
    }catch(e){}
    setPostsLoading(false);
  }
  async function submitPost(){
    if(!boardForm.nickname.trim()||!boardForm.content.trim()){SFX.err();showToast('닉네임과 내용을 입력해주세요!');return;}
    setPosting(true);
    try{
      const payload={...boardForm};
      if(isAdm) payload.adminPassword=ADMIN_PW;
      const r=await fetch('/api/posts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||'오류');
      SFX.coin();
      setBoardForm({nickname:boardForm.nickname,content:''});
      showToast('✦ 게시글이 등록됐어요!');
      fetchPosts();
    }catch(e){SFX.err();showToast('❌ '+e.message);}
    setPosting(false);
  }
  async function deletePost(id){
    try{
      const r=await fetch('/api/posts',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,password:ADMIN_PW})});
      if(r.ok){showToast('삭제됐어요');fetchPosts();}
    }catch(e){}
  }

  /* ── persist ── */
  useEffect(()=>{ localStorage.setItem('jlg_places_v2',JSON.stringify(places)); },[places]);
  useEffect(()=>{ localStorage.setItem('jlg_favs_v2',JSON.stringify([...favs])); },[favs]);
  useEffect(()=>{
    const fn=()=>setScroll(window.scrollY);
    window.addEventListener('scroll',fn,{passive:true});
    return()=>window.removeEventListener('scroll',fn);
  },[]);
  useEffect(()=>{ if(tab==='게시판') fetchPosts(); },[tab]);

  /* ── toast ── */
  function showToast(msg){
    clearTimeout(toastRef.current);
    setToast(msg);
    toastRef.current=setTimeout(()=>setToast(''),2500);
  }

  /* ── stamp animation on fav ── */
  function toggleFav(id){
    SFX.stamp();
    setFavs(prev=>{
      const n=new Set(prev);
      const adding=!n.has(id);
      adding?n.add(id):n.delete(id);
      if(adding) showStamp(id);
      return n;
    });
  }
  function showStamp(id){
    setStamps(p=>({...p,[id]:true}));
    setTimeout(()=>setStamps(p=>({...p,[id]:false})),700);
  }

  /* ── add/edit ── */
  function handleSubmit(e){
    e.preventDefault();
    if(!form.name.trim()||!form.link.trim()){SFX.err();return showToast('장소명과 링크는 필수!');}
    let link=form.link.trim();
    if(!/^https?:\/\//.test(link)) link='https://'+link;
    let bookingLink=form.bookingLink.trim();
    if(bookingLink&&!/^https?:\/\//.test(bookingLink)) bookingLink='https://'+bookingLink;
    SFX.coin();
    if(editId){
      setPlaces(p=>p.map(x=>x.id===editId?{...x,...form,link,bookingLink}:x));
      setEditId(null);
      showToast('★ 수정 완료');
    } else {
      setPlaces(p=>[...p,{...form,link,bookingLink,id:`p${Date.now()}`,at:Date.now()}]);
      showToast('★ 추가 완료');
    }
    setForm({name:'',category:'식당',desc:'',link:'',bookingLink:'',isFeatured:false,isSponsored:false});
  }

  /* ── delete ── */
  function doDelete(){
    SFX.err();
    setPlaces(p=>p.filter(x=>x.id!==delId));
    setFavs(p=>{const n=new Set(p);n.delete(delId);return n;});
    setModal(null);setDelId(null);
    showToast('삭제됨');
  }

  const [publishing, setPublishing] = useState(false);

  /* ── 라이브 발행 (GitHub 자동 업데이트) ── */
  async function publishToLive() {
    SFX.coin();
    setPublishing(true);
    showToast('🚀 발행 중...');
    try {
      const res = await fetch('/api/admin', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ password: ADMIN_PW, places }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '발행 실패');

      `// __PLACES_DATA_START__\nconst SEED_PLACES = ${newData};\n// __PLACES_DATA_END__`

    const blob=new Blob(['<!DOCTYPE html>\n'+updated.replace(/^<!DOCTYPE html>\n?/i,'')],{type:'text/html'});

      {/* FAB */}
      {view!=='saved'&&favs.size>0&&(
        <button className="fab" onClick={()=>{setView('saved');}}>
          ♥ MY PICKS
          <span className="fab-cnt">{favs.size}</span>
        </button>
      )}
      {view==='saved'&&(
        <button className="fab" onClick={()=>{setView('main');}}>
          ◁ ALL ENTRIES
        </button>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
