/* ══════════════════════════════════════════
   🎵  SOUND ENGINE  (Web Audio API)
══════════════════════════════════════════ */
const SFX = (() => {
  let _ctx = null;
  const get = () => {
    if (!_ctx) _ctx = new (window.AudioContext||window.webkitAudioContext)();
    if (_ctx.state === 'suspended') _ctx.resume();
    return _ctx;
  };
  const tick = () => {
    try {
      const ac = get(), o = ac.createOscillator(), g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.frequency.setValueAtTime(1800, ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(600, ac.currentTime+.04);
      g.gain.setValueAtTime(.08, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime+.07);
      o.start(); o.stop(ac.currentTime+.08);
    } catch {}
  };
  const stamp = () => {
    try {
      const ac = get();
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.setValueAtTime(90, ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(35, ac.currentTime+.12);
      g.gain.setValueAtTime(.5, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime+.18);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime+.2);
      const n = ac.sampleRate*.06, buf = ac.createBuffer(1,n,ac.sampleRate), d = buf.getChannelData(0);
      for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2)*.8;
      const src = ac.createBufferSource(); src.buffer = buf;
      const f = ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1200; f.Q.value=.7;
      const g2 = ac.createGain(); g2.gain.value=.9;
      src.connect(f); f.connect(g2); g2.connect(ac.destination); src.start();
    } catch {}
  };
  const coin = () => {
    try {
      const ac = get();
      [1047,1319,1568,2093].forEach((fr,i)=>{
        const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime+i*.055;
        o.type='triangle'; o.frequency.value=fr;
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.18,t+.01);
        g.gain.exponentialRampToValueAtTime(.001,t+.35);
        o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+.4);
      });
    } catch {}
  };
  const flip = () => {
    try {
      const ac = get(), n=ac.sampleRate*.14, buf=ac.createBuffer(1,n,ac.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n)*.45;
      const src=ac.createBufferSource(); src.buffer=buf;
      const f=ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=2500;
      const g=ac.createGain(); g.gain.value=.7;
      src.connect(f); f.connect(g); g.connect(ac.destination); src.start();
    } catch {}
  };
  const err = () => {
    try {
      const ac=get();
      [200,170,140].forEach((fr,i)=>{
        const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime+i*.08;
        o.type='square'; o.frequency.value=fr;
        g.gain.setValueAtTime(.08,t); g.gain.exponentialRampToValueAtTime(.001,t+.1);
        o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+.12);
      });
    } catch {}
  };
  const pop = () => {
    try {
      const ac=get(), o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.setValueAtTime(300,ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(600,ac.currentTime+.05);
      g.gain.setValueAtTime(.2,ac.currentTime); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.12);
      o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+.15);
    } catch {}
  };
  return {tick,stamp,coin,flip,err,pop};
})();

  .m-pri{

    width:100%;padding:13px;
    border:2px solid #C8A870;border-radius:2px;

  /* ── TOAST ── */

    padding:11px 20px;border-radius:3px;
    font-family:'Special Elite',cursive;font-size:12px;letter-spacing:1.5px;
    z-index:500;white-space:nowrap;

    animation:fadeUp .2s ease;

  /* ── SCROLL TO TOP ── */
  .back-top{
    position:fixed;bottom:90px;right:16px;
    width:40px;height:40px;

    border-radius:3px;font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;z-index:250;
    font-family:'Special Elite',cursive;

`;

/* ═══════════════════════════════════════════════
   APP COMPONENT
═══════════════════════════════════════════════ */
function App(){
  const [places, setPlaces] = useState(()=>{
    try{
      const s=localStorage.getItem('jlg_places_v2');
      if(s) return JSON.parse(s);
    }catch{}
    return SEED_PLACES;
  });
  const [favs,  setFavs]  = useState(()=>{
    try{return new Set(JSON.parse(localStorage.getItem('jlg_favs_v2')||'[]'));}
    catch{return new Set();}
  });
  const [tab,    setTab]    = useState('all');
  const [view,   setView]   = useState('main');
  const [isAdm,  setIsAdm]  = useState(false);
  const [modal,  setModal]  = useState(null);
  const [delId,  setDelId]  = useState(null);
  const [pw,     setPw]     = useState('');
  const [form,   setForm]   = useState({name:'',category:'식당',desc:'',link:'',bookingLink:'',isFeatured:false,isSponsored:false});
  const [editId, setEditId] = useState(null);
  const [toast,  setToast]  = useState('');
  const [stamps, setStamps] = useState({});
  const [scroll, setScroll] = useState(0);
  const toastRef = useRef();

  /* ── persist ── */
  useEffect(()=>{ localStorage.setItem('jlg_places_v2',JSON.stringify(places)); },[places]);
  useEffect(()=>{ localStorage.setItem('jlg_favs_v2',JSON.stringify([...favs])); },[favs]);
  useEffect(()=>{
    const fn=()=>setScroll(window.scrollY);
    window.addEventListener('scroll',fn,{passive:true});
    return()=>window.removeEventListener('scroll',fn);
  },[]);

  /* ── toast ── */
  function showToast(msg){
    clearTimeout(toastRef.current);
    setToast(msg);
    toastRef.current=setTimeout(()=>setToast(''),2500);
  }

  /* ── stamp animation on fav ── */
  function toggleFav(id){
    SFX.stamp();
    setFavs(prev=>{
      const n=new Set(prev);
      const adding=!n.has(id);
      adding?n.add(id):n.delete(id);
      if(adding) showStamp(id);
      return n;
    });
  }
  function showStamp(id){
    setStamps(p=>({...p,[id]:true}));
    setTimeout(()=>setStamps(p=>({...p,[id]:false})),700);
  }

  /* ── add/edit ── */
  function handleSubmit(e){
    e.preventDefault();
    if(!form.name.trim()||!form.link.trim()){SFX.err();return showToast('장소명과 링크는 필수!');}
    let link=form.link.trim();
    if(!/^https?:\/\//.test(link)) link='https://'+link;
    let bookingLink=form.bookingLink.trim();
    if(bookingLink&&!/^https?:\/\//.test(bookingLink)) bookingLink='https://'+bookingLink;
    SFX.coin();
    if(editId){
      setPlaces(p=>p.map(x=>x.id===editId?{...x,...form,link,bookingLink}:x));
      setEditId(null);
      showToast('★ 수정 완료');
    } else {
      setPlaces(p=>[...p,{...form,link,bookingLink,id:`p${Date.now()}`,at:Date.now()}]);
      showToast('★ 추가 완료');
    }
    setForm({name:'',category:'식당',desc:'',link:'',bookingLink:'',isFeatured:false,isSponsored:false});
  }

  /* ── delete ── */
  function doDelete(){
    SFX.err();
    setPlaces(p=>p.filter(x=>x.id!==delId));
    setFavs(p=>{const n=new Set(p);n.delete(delId);return n;});
    setModal(null);setDelId(null);
    showToast('삭제됨');
  }

  /* ── export HTML for GitHub ── */
  function exportHTML(){
    SFX.coin();
    const src=document.documentElement.outerHTML;
    const newData=JSON.stringify(places,null,2);
    const updated=src.replace(
      /\/\/ __PLACES_DATA_START__[\s\S]*?\/\/ __PLACES_DATA_END__/,
      `// __PLACES_DATA_START__\nconst SEED_PLACES = ${newData};\n// __PLACES_DATA_END__`
    );
    const blob=new Blob(['<!DOCTYPE html>\n'+updated.replace(/^<!DOCTYPE html>\n?/i,'')],{type:'text/html'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='index.html';a.click();
    URL.revokeObjectURL(url);
    setModal(null);
    showToast('📥 index.html 다운로드 — GitHub에 올려주세요!');
  }

  /* ── login ── */
  function doLogin(){
    if(pw===ADMIN_PW){setIsAdm(true);setModal(null);setPw('');SFX.coin();showToast('★ 관리자 모드');}
    else{setPw('');SFX.err();showToast('비밀번호 오류');}
  }

  /* ── start edit ── */
  function startEdit(p){
    SFX.tick();
    setForm({name:p.name,category:p.category,desc:p.desc||'',link:p.link,bookingLink:p.bookingLink||'',isFeatured:!!p.isFeatured,isSponsored:!!p.isSponsored});
    setEditId(p.id);
    window.scrollTo({top:0,behavior:'smooth'});
  }

  /* ── filters ── */
  const filtered  = tab==='all'?places:places.filter(p=>p.category===tab);
  const savedList = places.filter(p=>favs.has(p.id));
  const shown     = view==='saved'?savedList:filtered;
  const featured  = shown.filter(p=>p.isFeatured);
  const regular   = shown.filter(p=>!p.isFeatured);

  /* ── today's edition ── */
  const today = new Date();
  const edition = `Vol.${today.getFullYear().toString().slice(2)}${String(today.getMonth()+1).padStart(2,'0')} · Issue ${String(today.getDate()).padStart(2,'0')}`;

  /* ── RENDER CARD ── */
  const renderCard = (p,i) => {
    const c=getCat(p.category);
    const chked=favs.has(p.id);
    const showStampAnim=stamps[p.id];
    return (
      <div className={`card ${p.isFeatured?'featured':''}`} key={p.id}
        style={{animationDelay:`${Math.min(i*.06,.4)}s`}}>
        {p.isFeatured&&<div className="feat-ribbon">FEATURED</div>}
        <div className="card-in">
          <div className="card-top">
            <div className="card-stamp-wrap">
              <div className="card-stamp" style={{borderColor:c.border,background:c.bg,color:c.color}}>
                <div className="card-stamp-icon">
                  {c.key==='식당'?'🍽':c.key==='카페'?'☕':c.key==='숙소'?'🏡':'🎯'}
                </div>
                <div className="card-stamp-text" style={{color:c.border}}>{c.stamp}</div>
              </div>
            </div>
            <div className="card-info">
              <div className="card-name">{p.name}</div>
              <div className="card-tags">
                <span className="card-tag" style={{borderColor:c.border,color:c.color,background:c.bg}}>
                  {p.category}
                </span>
                {p.isSponsored&&<span className="sponsored-tag">AD</span>}
                {p.isFeatured&&<span className="card-tag" style={{borderColor:'#C8A000',color:'#C8A000',background:'#FFF8E0'}}>★ PICK</span>}
              </div>
              {p.desc&&<div className="card-desc">{p.desc}</div>}
            </div>
            <button className={`card-fav-btn ${chked?'on':''}`}
              onClick={()=>toggleFav(p.id)}>
              {chked?'♥':'♡'}
            </button>
          </div>
          <div className="card-foot">
            {p.bookingLink?(
              <a href={p.bookingLink} target="_blank" rel="noopener noreferrer" style={{flex:1}}>
                <button className="info-btn book-btn" style={{width:'100%'}}
                  onClick={()=>SFX.tick()}>
                  🔖 지금 예약하기
                </button>
              </a>
            ):(
              <a href={p.link} target="_blank" rel="noopener noreferrer" style={{flex:1}}>
                <button className="info-btn detail-btn" style={{width:'100%'}}
                  onClick={()=>SFX.tick()}>
                  ↗ 관련정보 보기
                </button>
              </a>
            )}
            {p.bookingLink&&(
              <a href={p.link} target="_blank" rel="noopener noreferrer">
                <button className="info-btn detail-btn" style={{padding:'10px 14px'}}
                  onClick={()=>SFX.tick()}>↗</button>
              </a>
            )}
            {isAdm&&(
              <div className="adm-btns">
                <button className="adm-btn" onClick={()=>startEdit(p)}>수정</button>
                <button className="adm-btn del" onClick={()=>{SFX.tick();setDelId(p.id);setModal('delete')}}>삭제</button>
              </div>
            )}
          </div>
        </div>
        {/* stamp animation */}
        {showStampAnim&&(
          <div className="stamp-overlay">
            <div className="stamp-mark show">SAVED!</div>
          </div>
        )}
      </div>
    );
  };

  return(
    <>
      <style>{CSS}</style>

      {/* TOAST */}
      {toast&&<div className="toast">{toast}</div>}

      {/* SCROLL TO TOP */}
      <button className={`back-top ${scroll>300?'show':''}`}
        onClick={()=>{window.scrollTo({top:0,behavior:'smooth'});SFX.tick();}}>↑</button>

      {/* MODALS */}
      {modal==='login'&&(
        <div className="overlay" onClick={()=>{setModal(null);setPw('')}}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-hdr">🔐 ADMIN ACCESS</div>
            <div className="modal-body">
              <p>관리자 비밀번호를 입력하세요.</p>
              <input className="pw-inp" type="password" placeholder="••••••••"
                value={pw} onChange={e=>setPw(e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&doLogin()} autoFocus/>
              <div className="modal-btns">
                <button className="m-sec" onClick={()=>{setModal(null);setPw('')}}>CANCEL</button>
                <button className="m-pri" onClick={doLogin}>ENTER</button>
              </div>
            </div>
          </div>
        </div>
      )}
      {modal==='delete'&&(
        <div className="overlay" onClick={()=>setModal(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-hdr">⚠ DELETE ENTRY</div>
            <div className="modal-body">
              <p>삭제하면 복구할 수 없어요. 계속할까요?</p>
              <div className="modal-btns">
                <button className="m-sec" onClick={()=>setModal(null)}>CANCEL</button>
                <button className="m-pri" style={{background:'#7C1A1A',borderColor:'#7C1A1A'}} onClick={doDelete}>DELETE</button>
              </div>
            </div>
          </div>
        </div>
      )}
      {modal==='export'&&(
        <div className="overlay" onClick={()=>setModal(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-hdr">📤 PUBLISH TO GITHUB</div>
            <div className="modal-body">
              <p>현재 장소 목록이 담긴 <b>index.html</b>을 다운로드해요. 다운받아서 GitHub에 올리면 모든 방문자가 볼 수 있어요!</p>
              <div className="modal-btns">
                <button className="m-sec" onClick={()=>setModal(null)}>CANCEL</button>
                <button className="m-pri" onClick={exportHTML}>📥 DOWNLOAD</button>
              </div>
            </div>
          </div>
        </div>
      )}
      {modal==='biz'&&(
        <div className="overlay" onClick={()=>setModal(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-hdr">★ 업체 등록 문의</div>
            <div className="modal-body">
              <p>제주 로컬 가이드에 내 업체를 등록하고 싶으시다면 아래 연락처로 문의해주세요.<br/><br/>
              📧 <b>hello@jejuguide.kr</b><br/>
              📱 카카오채널: @jejuguide</p>
              <div className="modal-btns">
                <button className="m-pri" onClick={()=>setModal(null)}>확인</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ═══════ APP ═══════ */}
      <div className="wrap">
        {/* MASTHEAD */}
        <div className="masthead">
          {/* TICKER */}
          <div className="ticker-wrap">
            <div className="ticker-inner">
              {[...Array(3)].map((_,i)=>(
                <span key={i} style={{display:'flex',alignItems:'center'}}>
                  <span className="ticker-item">제주 로컬 가이드</span>
                  <span className="ticker-sep">✦</span>
                  <span className="ticker-item">현지인이 직접 가본 곳만</span>
                  <span className="ticker-sep">✦</span>
                  <span className="ticker-item">Jeju Local's Pick</span>
                  <span className="ticker-sep">✦</span>
                  <span className="ticker-item">식당 · 카페 · 숙소 · 체험</span>
                  <span className="ticker-sep">✦</span>
                </span>
              ))}
            </div>
          </div>
          {/* TITLE */}
          <div className="mast-body">
            <div>
              <div className="mast-title">
                {view==='saved'?'MY PICKS':'JEJU GUIDE'}
              </div>
              <div className="mast-sub">
                {view==='saved'?`${savedList.length} places saved`:'Local\'s Finest Selection'}
              </div>
            </div>
            <div className="mast-btns">
              <button className={`mast-btn ${view==='saved'?'act':'sec'}`}
                onClick={()=>{SFX.flip();setView(view==='saved'?'main':'saved');}}>
                {view==='saved'?'◁ BACK':'♥ SAVED'}
              </button>
              {isAdm
                ?<>
                  <button className="mast-btn act" onClick={()=>setModal('export')}
                    style={{borderColor:'#4A8A4A',color:'#4A8A4A'}}>
                    📤
                  </button>
                  <button className="mast-btn sec" onClick={()=>{SFX.tick();setIsAdm(false);}}>✕</button>
                </>
                :<button className="mast-btn sec" onClick={()=>{SFX.tick();setModal('login');}}>🔐</button>
              }
            </div>
          </div>
          <div className="mast-divider"/>
          <div className="mast-meta">
            <div className="edition">{edition}</div>
            <div className="edition">Total {places.length} Entries</div>
          </div>
          {/* CATEGORY STAMPS */}
          {view!=='saved'&&(
            <div className="cat-bar">
              {CATS.map(c=>{
                const on=tab===c.key;
                return(
                  <button key={c.key}
                    className={`cat-stamp ${on?'on':''}`}
                    style={{color:on?c.color:'#8B6840'}}
                    onClick={()=>{SFX.flip();setTab(c.key);}}>
                    <div className="cat-stamp-label">{c.stamp}</div>
                    <div className="cat-stamp-sub">{c.label}</div>
                    <div className="cat-underline" style={{background:c.color}}/>
                  </button>
                );
              })}
            </div>
          )}
        </div>

        {/* BODY */}
        <div className="body">
          {/* ADMIN PANEL */}
          {isAdm&&view!=='saved'&&(
            <div className="adm-panel">
              <div className="adm-panel-body">
                <div className="adm-toolbar">
                  <div className="adm-title">{editId?'EDIT ENTRY':'NEW ENTRY'}</div>
                  <button className="export-btn" onClick={()=>setModal('export')}>📤 PUBLISH</button>
                </div>
                <form onSubmit={handleSubmit}>
                  <div className="field-row">
                    <div className="field" style={{flex:2}}>
                      <label>Place Name *</label>
                      <input placeholder="장소명" value={form.name}
                        onChange={e=>setForm({...form,name:e.target.value})} required/>
                    </div>
                    <div className="field" style={{flex:1}}>
                      <label>Category</label>
                      <select value={form.category} onChange={e=>setForm({...form,category:e.target.value})}>
                        {CATS.slice(1).map(c=><option key={c.key}>{c.key}</option>)}
                      </select>
                    </div>
                  </div>
                  <div className="field">
                    <label>Description (선택)</label>
                    <textarea placeholder="한 줄 소개. 주차 여부, 분위기, 추천 메뉴 등"
                      value={form.desc} onChange={e=>setForm({...form,desc:e.target.value})}/>
                  </div>
                  <div className="field">
                    <label>Main Link * (네이버 지도 / 인스타 / 홈페이지)</label>
                    <input placeholder="https://..." value={form.link}
                      onChange={e=>setForm({...form,link:e.target.value})} required/>
                  </div>
                  <div className="field">
                    <label>예약 링크 (선택 — 수익화용 제휴 링크)</label>
                    <input placeholder="https://... (야놀자, 에어비앤비, 클래스101 등)"
                      value={form.bookingLink} onChange={e=>setForm({...form,bookingLink:e.target.value})}/>
                  </div>
                  <div className="check-row">
                    <input type="checkbox" id="isFeat" checked={form.isFeatured}
                      onChange={e=>setForm({...form,isFeatured:e.target.checked})}/>
                    <label htmlFor="isFeat">★ FEATURED — 상단 노출 (광고 유료 등록)</label>
                  </div>
                  <div className="check-row" style={{marginBottom:'12px'}}>
                    <input type="checkbox" id="isSpon" checked={form.isSponsored}
                      onChange={e=>setForm({...form,isSponsored:e.target.checked})}/>
                    <label htmlFor="isSpon">AD — 스폰서 표시 (협찬 업체)</label>
                  </div>
                  <button type="submit" className="submit-btn" onClick={()=>{}}>
                    {editId?'✦ UPDATE ENTRY':'✦ ADD ENTRY'}
                  </button>
                  {editId&&(
                    <button type="button" className="cancel-btn"
                      onClick={()=>{SFX.tick();setEditId(null);setForm({name:'',category:'식당',desc:'',link:'',bookingLink:'',isFeatured:false,isSponsored:false});}}>
                      CANCEL
                    </button>
                  )}
                </form>
              </div>
            </div>
          )}

          {/* TOP AD BANNER */}
          {view!=='saved'&&(
            <div className="ad-banner" onClick={()=>{SFX.tick();setModal('biz');}}>
              <div className="ad-ico">📋</div>
              <div className="ad-text">
                <div className="ad-tag">Business Inquiry</div>
                <div className="ad-msg">이 곳에 내 업체를 등록하세요</div>
                <div className="ad-sub">현지인 추천 가이드 · 월 정액 피처드 플랜</div>
              </div>
              <div className="ad-arrow">›</div>
            </div>
          )}

          {/* SAVED BANNER */}
          {view==='saved'&&savedList.length>0&&(
            <div className="saved-banner">
              <div className="saved-title">♥ MY PICKS</div>
              <div className="saved-sub">카드 하트를 다시 누르면 저장 해제돼요</div>
            </div>
          )}

          {shown.length===0?(
            <div className="empty">
              <div className="empty-frame">
                {view==='saved'?'♥':tab==='식당'?'🍽':tab==='카페'?'☕':tab==='숙소'?'🏡':tab==='체험'?'🎯':'✦'}
              </div>
              <div className="empty-title">
                {view==='saved'?'NO SAVED PICKS':`NO ${tab==='all'?'ENTRIES':tab.toUpperCase()} YET`}
              </div>
              <div className="empty-sub">
                {view==='saved'
                  ?'카드의 ♡ 버튼을 눌러\n마음에 드는 장소를 저장해보세요'
                  :isAdm?'위에서 새 장소를 추가해보세요!'
                  :'곧 업데이트될 예정이에요'}
              </div>
            </div>
          ):(
            <>
              {/* FEATURED SECTION */}
              {featured.length>0&&(
                <>
                  <div className="sec-hdr">
                    <div className="sec-title">★ FEATURED PICKS</div>
                    <div className="sec-count">{featured.length}</div>
                  </div>
                  {featured.map((p,i)=>renderCard(p,i))}
                  <div className="divider">
                    <div className="divider-line"/>
                    <div className="divider-star">✦ ✦ ✦</div>
                    <div className="divider-line"/>
                  </div>
                </>
              )}

              {/* REGULAR SECTION */}
              {regular.length>0&&(
                <>
                  <div className="sec-hdr">
                    <div className="sec-title">{view==='saved'?'ALL SAVED':tab==='all'?'ALL ENTRIES':tab.toUpperCase()}</div>
                    <div className="sec-count">{regular.length}</div>
                  </div>
                  {regular.map((p,i)=>renderCard(p,i+featured.length))}
                </>
              )}

              {/* BUSINESS CTA */}
              {view!=='saved'&&regular.length>0&&(
                <div className="biz-cta">
                  <div className="biz-cta-body">
                    <div className="biz-title">내 업체를 소개하고 싶다면?</div>
                    <div className="biz-desc">
                      제주 로컬 가이드에 등록하고 더 많은 여행자에게<br/>
                      직접 운영하는 식당 · 카페 · 숙소를 알려보세요.<br/>
                      피처드 등록 · 광고 배너 · 예약 링크 연동 가능
                    </div>
                    <button className="biz-btn" onClick={()=>{SFX.coin();setModal('biz');}}>
                      ★ 등록 문의하기
                    </button>
                  </div>
                </div>
              )}
            </>
          )}
        </div>
      </div>

      {/* FAB */}
      {view!=='saved'&&favs.size>0&&(
        <button className="fab" onClick={()=>{SFX.flip();setView('saved');}}>
          ♥ MY PICKS
          <span className="fab-cnt">{favs.size}</span>
        </button>
      )}
      {view==='saved'&&(
        <button className="fab" onClick={()=>{SFX.flip();setView('main');}}>
          ◁ ALL ENTRIES
        </button>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
